<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Warfront Battle Prototype</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#111827;color:#fff;overflow-x:hidden}
.app{max-width:900px;margin:auto;min-height:100vh;background:linear-gradient(#18243a,#0d1422);padding-bottom:20px}
header{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:900;letter-spacing:.5px}
.logo span{display:block;font-size:11px;color:#9fb5d8;letter-spacing:2px}
.stats{display:flex;gap:8px;font-size:12px}
.pill{background:#202f49;border:1px solid #385070;border-radius:12px;padding:7px 9px}
.arenaWrap{padding:8px 10px}
.arena{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;background:#26344b;padding:4px;border:3px solid #465a76;border-radius:16px;aspect-ratio:2/1;overflow:hidden}
.cell{border-radius:4px;background:#31435d;position:relative;cursor:pointer}
.cell.blue{background:#27517a}
.cell.red{background:#71333b}
.cell:hover{filter:brightness(1.2)}
.base{position:absolute;top:50%;transform:translateY(-50%);width:62px;height:90px;border-radius:14px;border:4px solid #dbeafe;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;box-shadow:0 5px 15px #0008}
.base.you{left:7px;background:#1766a8}.base.enemy{right:7px;background:#a72f38}
.base small{font-size:10px;font-weight:bold}
.hp{width:50px;height:7px;background:#171717;border-radius:8px;margin-top:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:#55e06c}
.unit{position:absolute;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:3;border:2px solid white;transition:left .2s,top .2s}
.unit.you{background:#2189d6}.unit.enemy{background:#d84b50}
.commander{box-shadow:0 0 0 3px #ffd34d,0 0 16px #ffd34d}
.controls{padding:6px 10px}
.timerRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.timer{font-size:22px;font-weight:900}.phase{font-size:12px;color:#ffd34d}
.energyBox{background:#202f49;border-radius:12px;padding:7px 10px;margin-bottom:8px}
.energyTop{display:flex;justify-content:space-between;font-size:12px}
.energyBar{height:10px;background:#0b1020;border-radius:8px;margin-top:5px;overflow:hidden}.energyBar i{display:block;height:100%;background:#52d7ff;width:50%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.card{background:#202f49;border:2px solid #385070;border-radius:13px;padding:8px 5px;text-align:center;min-height:88px;cursor:pointer}
.card.selected{border-color:#ffd34d;transform:translateY(-2px)}
.card.disabled{opacity:.45}.emoji{font-size:25px}.name{font-size:11px;font-weight:800}.cost{font-size:11px;color:#62d8ff;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button{border:0;border-radius:13px;padding:12px;font-weight:900;color:white;font-size:14px;background:#277bc1;cursor:pointer}
button:active{transform:scale(.98)}
button.secondary{background:#34445e}button.gold{background:#d79422;color:#151515}
#message{text-align:center;min-height:20px;font-size:13px;color:#cbd5e1;margin-top:8px}
.overlay{position:fixed;inset:0;background:#050914dd;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{max-width:420px;width:100%;background:#17243a;border:2px solid #49617f;border-radius:22px;padding:25px;text-align:center;box-shadow:0 20px 50px #000}
.modal h1{font-size:34px;margin:5px}.modal p{color:#c4d0e2;line-height:1.5}
@media(max-width:600px){.logo{font-size:20px}.base{width:50px;height:75px;font-size:21px}.cell{min-width:0}.cards{gap:5px}.card{padding:6px 2px}.emoji{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">⚔️ WARFRONT BATTLE<span>PLAYABLE WEB PROTOTYPE</span></div>
  <div class="stats"><div class="pill">💎 250</div><div class="pill">⭐ Lv.1</div></div>
</header>

<div class="arenaWrap">
  <div class="arena" id="arena"></div>
</div>

<div class="controls">
  <div class="timerRow"><div><span class="timer" id="timer">0:20</span> <span class="phase" id="phase">SETUP</span></div><div>🏰 <b id="myHpText">1000</b> | <b id="enemyHpText">1000</b> 🏰</div></div>
  <div class="energyBox"><div class="energyTop"><b>⚡ WAR ENERGY</b><span id="energyText">5 / 10</span></div><div class="energyBar"><i id="energyFill"></i></div></div>
  <div class="cards" id="cards"></div>
  <div class="actions">
    <button class="gold" id="battleBtn">⚔️ START BATTLE</button>
    <button class="secondary" id="abilityBtn">☀️ COMMANDER ABILITY</button>
  </div>
  <div id="message">Select a troop, then tap a blue square to deploy it.</div>
</div>
</div>

<div class="overlay" id="overlay"><div class="modal">
<h1 id="result">VICTORY!</h1><p id="resultText"></p>
<button onclick="location.reload()">🔄 PLAY AGAIN</button>
</div></div>

<script>
const troopTypes=[
 {id:'rifle',name:'Rifleman',emoji:'🪖',cost:2,hp:100,dmg:12,range:1,speed:.48},
 {id:'gren',name:'Grenadier',emoji:'🧨',cost:3,hp:80,dmg:24,range:1,speed:.38},
 {id:'heavy',name:'Heavy',emoji:'🛡️',cost:4,hp:220,dmg:10,range:1,speed:.25},
 {id:'rocket',name:'Rocket',emoji:'🚀',cost:5,hp:75,dmg:38,range:2,speed:.30}
];
const arena=document.getElementById('arena');
let phase='setup', seconds=20, energy=5, myHp=1000, enemyHp=1000, selected='rifle';
let units=[], running=false, abilityUsed=false, last=performance.now(), energyTick=0, aiTick=0;

for(let r=0;r<6;r++) for(let c=0;c<12;c++){
 const d=document.createElement('div'); d.className='cell '+(c<6?'blue':'red'); d.dataset.r=r; d.dataset.c=c;
 d.onclick=()=>deploy(c,r);
 arena.appendChild(d);
}
const baseYou=document.createElement('div');baseYou.className='base you';baseYou.innerHTML='🏰<small>YOU</small><div class="hp"><i id="myBar"></i></div>';arena.appendChild(baseYou);
const baseEnemy=document.createElement('div');baseEnemy.className='base enemy';baseEnemy.innerHTML='🏰<small>ENEMY</small><div class="hp"><i id="enemyBar"></i></div>';arena.appendChild(baseEnemy);

function renderCards(){
 const box=document.getElementById('cards');box.innerHTML='';
 troopTypes.forEach(t=>{
  const d=document.createElement('div');d.className='card '+(selected===t.id?'selected ':'')+(energy<t.cost?'disabled':'');
  d.innerHTML=`<div class="emoji">${t.emoji}</div><div class="name">${t.name}</div><div class="cost">⚡ ${t.cost}</div>`;
  d.onclick=()=>{selected=t.id;renderCards();};
  box.appendChild(d);
 });
}
renderCards();

function deploy(c,r){
 if(c>5){msg('You can only deploy on your blue side.');return}
 if(phase==='battle' && energy<getT().cost){msg('Not enough War Energy!');return}
 if(phase==='done'){return}
 if(phase==='setup' || phase==='battle'){
  const t=getT(); if(energy<t.cost){msg('Need more War Energy.');return}
  energy-=t.cost; units.push({side:'you',type:t.id,c,r,hp:t.hp,level:1,el:null});
  msg(`${t.name} deployed!`);
  update();
 }
}
function getT(){return troopTypes.find(x=>x.id===selected)}
function spawnEnemy(){
 const t=troopTypes[Math.floor(Math.random()*troopTypes.length)];
 if(t.cost>10)return;
 units.push({side:'enemy',type:t.id,c:11,r:Math.floor(Math.random()*6),hp:t.hp,level:1,el:null});
}
function makeEl(u){
 if(u.el)return;
 const el=document.createElement('div');el.className='unit '+u.side+(u.type==='heavy'?' commander':'');
 el.textContent=troopTypes.find(t=>t.id===u.type).emoji;
 arena.appendChild(el);u.el=el;
}
function draw(){
 units.forEach(u=>{makeEl(u);u.el.style.left=`calc(${u.c} * (100% / 12) + 3px)`;u.el.style.top=`calc(${u.r} * (100% / 6) + 3px)`;});
}
function update(){
 document.getElementById('energyText').textContent=`${Math.floor(energy)} / 10`;
 document.getElementById('energyFill').style.width=(energy*10)+'%';
 document.getElementById('myHpText').textContent=Math.max(0,Math.round(myHp));
 document.getElementById('enemyHpText').textContent=Math.max(0,Math.round(enemyHp));
 document.getElementById('myBar').style.width=Math.max(0,myHp/10)+'%';
 document.getElementById('enemyBar').style.width=Math.max(0,enemyHp/10)+'%';
 renderCards();draw();
}
function msg(x){document.getElementById('message').textContent=x}
function startBattle(){
 if(running)return;
 running=true;phase='battle';document.getElementById('battleBtn').textContent='⚔️ BATTLE IN PROGRESS';
 msg('Battle started! Push across the battlefield and destroy the enemy base!');
}
document.getElementById('battleBtn').onclick=startBattle;
document.getElementById('abilityBtn').onclick=()=>{
 if(abilityUsed||phase!=='battle'){msg(phase==='setup'?'Start the battle first!':'Ability unavailable.');return}
 abilityUsed=true;
 units.filter(u=>u.side==='you').forEach(u=>u.hp+=35);
 enemyHp=Math.max(0,enemyHp-90);
 msg('☀️ SOLAR SURGE! Your army is empowered and the enemy base takes 90 damage!');
 update();checkEnd();
};

function battleStep(dt){
 energy=Math.min(10,energy+dt*.8);
 energyTick+=dt;aiTick+=dt;
 if(aiTick>2.2){aiTick=0;spawnEnemy()}
 units.forEach(u=>{
   const t=troopTypes.find(x=>x.id===u.type);
   u.c += (u.side==='you'?1:-1)*t.speed*dt;
   const targets=units.filter(v=>v.side!==u.side && Math.abs(v.c-u.c)<1.1 && v.r===u.r);
   if(targets.length){
     targets[0].hp-=t.dmg*dt;
     u.c -= (u.side==='you'?1:-1)*t.speed*dt;
   } else if((u.side==='you'&&u.c>=11)||(u.side==='enemy'&&u.c<=0)){
     if(u.side==='you')enemyHp-=t.dmg*2.1*dt; else myHp-=t.dmg*1.8*dt;
     u.c=Math.max(0,Math.min(11,u.c));
   }
 });
 units=units.filter(u=>{
   if(u.hp<=0){u.el?.remove();return false}
   return true;
 });
 checkEnd();update();
}
function checkEnd(){
 if(enemyHp<=0 || myHp<=0 || seconds<=0){
   phase='done';running=false;
   let victory=enemyHp<=0 || (seconds<=0 && myHp>enemyHp);
   document.getElementById('result').textContent=victory?'🏆 VICTORY!':'💀 DEFEAT';
   document.getElementById('resultText').textContent=enemyHp<=0?'Enemy base destroyed!':myHp<=0?'Your base was destroyed!':`Time's up. Your base: ${Math.round(myHp)} HP • Enemy base: ${Math.round(enemyHp)} HP`;
   document.getElementById('overlay').style.display='flex';return true;
 }
 return false;
}
function loop(now){
 const dt=Math.min(.08,(now-last)/1000);last=now;
 if(running) battleStep(dt);
 requestAnimationFrame(loop);
}
setInterval(()=>{
 if(phase==='setup'){
   seconds--; if(seconds<=0){seconds=120;startBattle()}
 } else if(phase==='battle'){
   seconds--; if(seconds<=0)checkEnd();
 }
 const m=Math.floor(seconds/60),s=seconds%60;
 document.getElementById('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
 document.getElementById('phase').textContent=phase.toUpperCase();
},1000);
update();requestAnimationFrame(loop);
</script>
</body>
</html>
