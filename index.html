<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Warfront Battle V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d1626;color:#fff;font-family:Arial,sans-serif}
.app{max-width:900px;margin:auto;min-height:100vh;padding:14px;background:linear-gradient(#182943,#0d1626)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:25px;font-weight:900}.sub{font-size:10px;color:#a9bddb;letter-spacing:2px}
.pill{background:#223653;border:2px solid #405978;border-radius:14px;padding:9px;font-size:12px}
.arena{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:5px;aspect-ratio:1.9;background:linear-gradient(#40536b,#273b54);border:4px solid #5b708d;border-radius:20px;overflow:hidden}
.cell{border:1px solid #ffffff16;border-radius:6px;background:#34536c;cursor:pointer}
.cell.blue{background:#285c84}.cell.red{background:#783d48}.cell.mid{background:#58664d}
.base{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:64px;height:88px;border:4px solid white;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px}
.base small{font-size:9px;font-weight:900}.you{left:6px;background:#176dae}.enemy{right:6px;background:#ad3542}
.unit{position:absolute;width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;font-size:17px;z-index:5;transform:translate(-50%,-50%);transition:left .14s linear,top .14s linear}
.unit.you{background:#2489d1}.unit.enemy{background:#c74a56}
.commander{width:40px;height:40px;font-size:24px;border-color:#ffd34d;box-shadow:0 0 0 3px #ffd34d55}
.hp{position:absolute;top:31px;width:30px;height:4px;background:#111;border-radius:4px;overflow:hidden}.hp i{display:block;height:100%;background:#62dc79}
.aura{position:absolute;width:80px;height:80px;border:3px solid #ffd34d;border-radius:50%;z-index:4;transform:translate(-50%,-50%);box-shadow:0 0 28px #ffd34d88;animation:pulse .65s infinite alternate;pointer-events:none}
@keyframes pulse{from{opacity:.45;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.info{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}.timer{font-size:25px;font-weight:900;text-align:center}
.bar{height:8px;background:#111;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#61dc79}
.energy{background:#223653;border:2px solid #405978;border-radius:14px;padding:9px;margin-bottom:10px}.energyrow{display:flex;justify-content:space-between;font-size:12px}.energybar{height:10px;background:#111;border-radius:8px;overflow:hidden;margin-top:5px}.energybar i{display:block;height:100%;background:#52d5ff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.card{min-height:84px;border:2px solid #405978;border-radius:14px;background:#223653;color:#fff;padding:7px 3px;text-align:center;font-weight:800}.card.sel{border-color:#ffd34d}.card small{display:block;color:#a9bddb;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{min-height:48px;border:0;border-radius:14px;font-weight:900;font-size:13px;background:#d99420;color:#171717}.btn.dark{background:#40536e;color:#fff}.btn:disabled{opacity:.45}
.upgrade{display:flex;gap:7px;align-items:center;justify-content:center;margin-top:8px}.upgrade .btn{background:#2d78b8;color:white}
.msg{text-align:center;min-height:22px;margin-top:8px;color:#c9d5e6;font-size:13px}
@media(max-width:500px){.logo{font-size:20px}.base{width:50px;height:72px;font-size:20px}.unit{width:25px;height:25px;font-size:14px}.commander{width:35px;height:35px}.card{font-size:11px}.cards{gap:4px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="logo">⚔️ WARFRONT BATTLE</div><div class="sub">V2 • COMMANDER ASSAULT</div></div><div class="pill">⭐ COMMANDER Lv.1</div></header>
<div class="arena" id="arena"></div>
<div class="info">
<div><b>🏰 YOU <span id="my">1000</span></b><div class="bar"><i id="mybar" style="width:100%"></i></div></div>
<div class="timer" id="timer">0:20</div>
<div style="text-align:right"><b>ENEMY <span id="enemy">1000</span> 🏰</b><div class="bar"><i id="enemybar" style="width:100%"></i></div></div>
</div>
<div class="energy"><div class="energyrow"><b>⚡ WAR ENERGY</b><b id="energy">5 / 10</b></div><div class="energybar"><i id="energybar" style="width:50%"></i></div></div>
<div class="cards" id="cards"></div>
<div class="actions"><button class="btn" id="start">⚔️ START BATTLE</button><button class="btn dark" id="ability">☀️ SOLAR SURGE</button></div>
<div class="upgrade"><span id="selected">Selected: Rifleman Lv.1</span><button class="btn" id="upgrade">⬆️ UPGRADE</button></div>
<div class="msg" id="msg">20-second setup: select a troop and tap a blue square to deploy.</div>
</div>
<script>
(() => {
const arena=document.getElementById('arena'), cards=document.getElementById('cards');
const T=[
{id:'rifle',e:'🪖',n:'Rifleman',c:2,h:100,d:13,s:.55},
{id:'gren',e:'🧨',n:'Grenadier',c:3,h:82,d:25,s:.42},
{id:'heavy',e:'🛡️',n:'Heavy',c:4,h:230,d:11,s:.27},
{id:'rocket',e:'🚀',n:'Rocket',c:5,h:78,d:40,s:.32}
];
let selected='rifle',energy=5,my=1000,enemy=1000,time=20,phase='setup',running=false,ability=false;
let levels={rifle:1,gren:1,heavy:1,rocket:1},units=[],last=performance.now(),ai=0,aura=null;

for(let r=0;r<6;r++) for(let c=0;c<12;c++){
 const cell=document.createElement('button'); cell.className='cell '+(c<6?'blue':'red')+(c>=5&&c<=6?' mid':'');
 cell.type='button'; cell.addEventListener('click',()=>deploy(c,r)); arena.appendChild(cell);
}
const b1=document.createElement('div');b1.className='base you';b1.innerHTML='🏰<small>YOU</small>';arena.appendChild(b1);
const b2=document.createElement('div');b2.className='base enemy';b2.innerHTML='🏰<small>ENEMY</small>';arena.appendChild(b2);

function get(){return T.find(t=>t.id===selected)}
function say(x){document.getElementById('msg').textContent=x}
function deploy(c,r){
 if(phase==='done')return;
 if(c>5){say('Deploy on your blue territory.');return}
 const t=get();
 if(energy<t.c){say('Not enough War Energy.');return}
 energy-=t.c;
 units.push({side:'you',type:t.id,c,r,hp:t.h,level:levels[t.id],el:null});
 say(t.e+' '+t.n+' deployed!');
 render();
}
function spawnEnemy(){
 const t=T[Math.floor(Math.random()*T.length)];
 units.push({side:'enemy',type:t.id,c:11,r:Math.floor(Math.random()*6),hp:t.h,level:1,el:null});
}
function make(u){
 if(u.el)return;
 const el=document.createElement('div');
 el.className='unit '+(u.side==='you'?'you':'enemy')+(u.side==='you'&&u.type==='heavy'?' commander':'');
 el.textContent=T.find(t=>t.id===u.type).e;
 const hp=document.createElement('span');hp.className='hp';hp.innerHTML='<i></i>';el.appendChild(hp);
 arena.appendChild(el);u.el=el;
}
function render(){
 document.getElementById('energy').textContent=Math.floor(energy)+' / 10';
 document.getElementById('energybar').style.width=(energy*10)+'%';
 document.getElementById('my').textContent=Math.max(0,Math.round(my));
 document.getElementById('enemy').textContent=Math.max(0,Math.round(enemy));
 document.getElementById('mybar').style.width=Math.max(0,my/10)+'%';
 document.getElementById('enemybar').style.width=Math.max(0,enemy/10)+'%';
 document.getElementById('selected').textContent='Selected: '+get().n+' Lv.'+levels[selected];
 cards.innerHTML='';
 T.forEach(t=>{
   const b=document.createElement('button');b.type='button';b.className='card '+(selected===t.id?'sel':'');
   b.innerHTML='<div style="font-size:24px">'+t.e+'</div>'+t.n+'<small>⚡ '+t.c+' • Lv.'+levels[t.id]+'</small>';
   b.disabled=energy<t.c;b.addEventListener('click',()=>{selected=t.id;render()});cards.appendChild(b);
 });
 units.forEach(u=>{
   make(u);
   u.el.style.left=((u.c+.5)/12*100)+'%';
   u.el.style.top=((u.r+.5)/6*100)+'%';
   u.el.querySelector('i').style.width=Math.max(0,u.hp/T.find(t=>t.id===u.type).h*100)+'%';
 });
}
document.getElementById('start').addEventListener('click',()=>{
 if(phase==='done'){location.reload();return}
 if(!running){running=true;phase='battle';time=120;document.getElementById('start').textContent='⚔️ BATTLE IN PROGRESS';say('Battle started! Deploy, upgrade and push forward!')}
});
document.getElementById('upgrade').addEventListener('click',()=>{
 if(phase!=='battle'){say('Start the battle before upgrading.');return}
 if(levels[selected]>=3){say(get().n+' is already max level.');return}
 const cost=2+levels[selected]*2;
 if(energy<cost){say('Need '+cost+' War Energy to upgrade '+get().n+'.');return}
 energy-=cost;levels[selected]++;
 units.filter(u=>u.side==='you'&&u.type===selected).forEach(u=>{u.level=levels[selected];u.hp*=1.2});
 say('⬆️ '+get().n+' upgraded to Level '+levels[selected]+'!');
 render();
});
document.getElementById('ability').addEventListener('click',()=>{
 if(phase!=='battle'){say('Start the battle before using Solar Surge.');return}
 if(ability){say('Solar Surge already used.');return}
 ability=true;enemy=Math.max(0,enemy-100);
 units.filter(u=>u.side==='you').forEach(u=>u.hp+=55);
 const c=units.find(u=>u.side==='you'&&u.type==='heavy')||units.find(u=>u.side==='you');
 if(c){aura=document.createElement('div');aura.className='aura';arena.appendChild(aura);aura.style.left=((c.c+.5)/12*100)+'%';aura.style.top=((c.r+.5)/6*100)+'%'}
 say('☀️ SOLAR SURGE! Your Commander empowers the army!');
 render();check();
});
function check(){
 if(enemy<=0||my<=0||time<=0){
   running=false;phase='done';
   const win=enemy<=0||(time<=0&&my>enemy);
   say(win?'🏆 VICTORY! Enemy base destroyed!':'💀 DEFEAT. Your base has fallen.');
   document.getElementById('start').textContent='🔄 PLAY AGAIN';
   return true;
 }
 return false;
}
function step(dt){
 energy=Math.min(10,energy+dt*.85);ai+=dt;
 if(ai>2.4){ai=0;spawnEnemy()}
 units.forEach(u=>{
   const t=T.find(x=>x.id===u.type), power=1+(u.level-1)*.22;
   const target=units.find(v=>v.side!==u.side&&Math.abs(v.c-u.c)<1.15&&v.r===u.r);
   if(target){target.hp-=t.d*power*dt}
   else{
     u.c+=(u.side==='you'?1:-1)*t.s*dt;
     if((u.side==='you'&&u.c>=11)||(u.side==='enemy'&&u.c<=0)){
       if(u.side==='you')enemy-=t.d*2.2*power*dt; else my-=t.d*1.8*dt;
       u.c=Math.max(0,Math.min(11,u.c));
     }
   }
 });
 units=units.filter(u=>{if(u.hp<=0){u.el?.remove();return false}return true});
 if(aura){
   const c=units.find(u=>u.side==='you'&&u.type==='heavy')||units.find(u=>u.side==='you');
   if(c){aura.style.left=((c.c+.5)/12*100)+'%';aura.style.top=((c.r+.5)/6*100)+'%'}
 }
 check();render();
}
setInterval(()=>{
 if(phase==='setup'){time--;if(time<=0){running=true;phase='battle';time=120;document.getElementById('start').textContent='⚔️ BATTLE IN PROGRESS';say('Battle started automatically!')}}
 else if(phase==='battle'){time--;check()}
 const m=Math.floor(Math.max(0,time)/60),s=Math.max(0,time)%60;
 document.getElementById('timer').textContent=m+':'+String(s).padStart(2,'0');
},1000);
function loop(now){const dt=Math.min(.08,(now-last)/1000);last=now;if(running)step(dt);requestAnimationFrame(loop)}
render();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
